name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-aiohttp python3-serial python3-bleak python3-pefile msitools
      - name: Syntax check
        run: |
          python3 -m py_compile host/*.py tests/*.py
          node --check electron/main.js
      - name: Serial bridge end-to-end test (fake hub on a pty)
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -q dnfile==0.18.0
          mkdir -p app/platform/hosts app/platform/web
          echo '{"name":"LEGO Education SPIKE","userDataFolder":"SPIKE3-ci","fileAssociations":[{"ext":"llsp3"}]}' > app/platform/hosts/appconfig.json
          echo '<html><head></head></html>' > app/platform/web/index.html
          timeout 60 .venv/bin/python tests/test_rpc_serial.py

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm python3-pip
      - name: Build .deb + .rpm (Electron)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VER="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          packaging/build.sh "$VER"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
          retention-days: 7

  install-test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:13", "fedora:42"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: packages, path: dist }
      - name: Install, launch Electron, check, remove (${{ matrix.image }})
        run: |
          docker run --rm --shm-size=1g -v "$PWD/dist:/dist:ro" \
            -v "$PWD/packaging/test-pkg-in-docker.sh:/t.sh:ro" "${{ matrix.image }}" bash /t.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: install-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: packages, path: dist }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum *.deb *.rpm > SHA256SUMS && cat SHA256SUMS && cd ..
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.rpm dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --notes-file packaging/release-notes.md
