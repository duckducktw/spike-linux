name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# least privilege: everything is read-only except the job that publishes the release
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-aiohttp python3-serial python3-bleak python3-pefile msitools
      - name: Syntax check
        run: |
          python3 -m py_compile host/*.py tests/*.py
          node --check electron/main.js
          node --check electron/preload.js
      - name: Host tests (security, menu RPC, concurrency, serial bridge, MSI extraction)
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -q dnfile==0.18.0
          mkdir -p app/platform/hosts/translations app/platform/web
          echo '{"name":"LEGO Education SPIKE","userDataFolder":"SPIKE3-ci","fileAssociations":[{"ext":"llsp3"}]}' > app/platform/hosts/appconfig.json
          echo '{"menu":{"file":{"title":"File"},"edit":{"title":"Edit"}}}' > app/platform/hosts/translations/hostapp.en-US.json
          echo '<html><head></head><body><div id="app"></div></body></html>' > app/platform/web/index.html
          timeout 60 .venv/bin/python tests/test_host_security.py
          timeout 60 .venv/bin/python tests/test_concurrent_save.py
          timeout 60 .venv/bin/python tests/test_rpc_serial.py
          timeout 60 .venv/bin/python tests/test_extract_traversal.py
          timeout 60 .venv/bin/python tests/test_shutdown.py

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Cache Electron / electron-builder downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('electron/package-lock.json') }}
      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm python3-pip
      - name: Build .deb + .rpm (Electron)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VER="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          packaging/build.sh "$VER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
          retention-days: 7

  install-test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:13", "fedora:42"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with: { name: packages, path: dist }
      - name: Install, launch Electron, check, remove (${{ matrix.image }})
        run: |
          docker run --rm --shm-size=1g -v "$PWD/dist:/dist:ro" \
            -v "$PWD/packaging/test-pkg-in-docker.sh:/t.sh:ro" "${{ matrix.image }}" bash /t.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: install-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with: { name: packages, path: dist }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum *.deb *.rpm > SHA256SUMS && cat SHA256SUMS && cd ..
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.rpm dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --notes-file packaging/release-notes.md
