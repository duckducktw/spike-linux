name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build + runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot lintian python3-pip python3-aiohttp python3-serial python3-bleak python3-pefile msitools

      - name: Syntax check
        run: python3 -m py_compile host/*.py tests/*.py

      - name: Serial bridge end-to-end test (fake hub on a pty)
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -q dnfile==0.18.0
          # host needs an appconfig to start; a minimal stub is enough for the RPC/serial test
          mkdir -p app/platform/hosts app/platform/web
          echo '{"name":"LEGO Education SPIKE","userDataFolder":"SPIKE3-ci","fileAssociations":[{"ext":"llsp3"}]}' > app/platform/hosts/appconfig.json
          echo '<html><head></head></html>' > app/platform/web/index.html
          timeout 60 .venv/bin/python tests/test_rpc_serial.py

      - name: Build .deb
        id: deb
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VER="0.0.0~ci${GITHUB_RUN_NUMBER}"
          DEB=$(packaging/build-deb.sh "$VER")
          echo "path=$DEB" >> "$GITHUB_OUTPUT"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          lintian --no-tag-display-limit "$DEB" || true

      - name: Install test (clean Ubuntu container)
        run: |
          docker run --rm -v "$PWD/dist:/dist" ubuntu:24.04 bash -euxc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /dist/*.deb
            spike3 --version
            python3 -c "import sys; sys.path.insert(0, \"/usr/lib/spike3-linux/vendor\"); import dnfile, aiohttp, serial, bleak; print(\"imports ok\")"
            test -f /usr/lib/udev/rules.d/70-lego-spike.rules
            test -f /usr/share/applications/lego-spike3.desktop
            apt-get remove -y -qq spike3-linux'

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum *.deb > SHA256SUMS && cd ..
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --notes-file packaging/release-notes.md
